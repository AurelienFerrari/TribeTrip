#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Configuring :backend must never evaluate :composeApp (Android/Compose Multiplatform) and
# vice versa — this is what lets the backend/Dockerfile build without an Android SDK.
org.gradle.configureondemand=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9.0's built-in Kotlin support blocks combining com.android.application with the
# org.jetbrains.kotlin.multiplatform plugin unless this classic (pre-built-in-Kotlin) mode is kept.
# composeApp needs this combo (application module + full KMP target set), so opt out of built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false

#Kotlin/Native
kotlin.native.ignoreDisabledTargets=true