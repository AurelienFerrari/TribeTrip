services:
  - type: web
    name: tribetrip-backend-dev
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    branch: DEV
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      # Set manually in the Render dashboard: Neon "dev" branch connection string.
      - key: DATABASE_URL
        sync: false
      # Set manually in the Render dashboard: any long random secret.
      - key: JWT_SECRET
        sync: false

  - type: web
    name: tribetrip-backend-prod
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Set manually in the Render dashboard: Neon production branch connection string.
      - key: DATABASE_URL
        sync: false
      # Set manually in the Render dashboard: a DIFFERENT long random secret from dev.
      - key: JWT_SECRET
        sync: false
